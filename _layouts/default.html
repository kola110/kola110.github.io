<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>{% if page.title %}{{ page.title }} · {% endif %}代码与日子</title>
<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<meta property="og:site_name" content="代码与日子" />
<meta property="og:locale" content="zh_CN" />
<meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}" />
<meta property="og:title" content="{% if page.title %}{{ page.title }} · 代码与日子{% else %}代码与日子{% endif %}" />
<meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ '/assets/images/desk.webp' | absolute_url }}{% endif %}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} · 代码与日子{% else %}代码与日子{% endif %}" />
<meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
<meta name="twitter:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ '/assets/images/desk.webp' | absolute_url }}{% endif %}" />
{% if page.date %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"BlogPosting","headline":"{{ page.title | escape }}","description":"{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}","datePublished":"{{ page.date | date_to_xmlschema }}","author":{"@type":"Person","name":"kola110"},"mainEntityOfPage":"{{ page.url | absolute_url }}"}
</script>
{% endif %}
<link rel="stylesheet" href="/assets/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
{% feed_meta %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XWQT1N1G7Y"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XWQT1N1G7Y');
</script>
</head>
<body>
<header class="topbar"><div class="wrap topbar-inner">
<a class="wordmark" href="/">代码<em>与</em>日子</a>
<nav class="topnav" aria-label="栏目"><a href="/#articles" data-nav="all">全部</a><a href="/?cat=code#articles" data-nav="code">编程</a><a href="/?cat=life#articles" data-nav="life">生活</a><a href="/#archive">归档</a><a href="/about/">关于</a></nav><span id="google_translate_element" class="translate-widget-hidden"></span>
<select id="lang-select" class="lang-select notranslate" translate="no" aria-label="选择语言 / Language">
  <option value="" selected>&#127760; Language / 语言</option>
  <option value="zh-CN">中文</option>
  <option value="en">English</option>
  <option value="ja">日本語</option>
  <option value="ko">한국어</option>
  <option value="fr">Français</option>
  <option value="de">Deutsch</option>
  <option value="es">Español</option>
  <option value="ru">Русский</option>
</select>
</div></header>
<main><div class="wrap">
{{ content }}
</div></main>
<footer><div class="wrap"><span>代码与日子 · 写编程，也写生活</span><span><a href="/feed.xml">RSS 订阅</a> · <a href="/about/">关于</a></span><span>2026</span></div></footer>

<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'zh-CN', includedLanguages: 'en,ja,ko,fr,de,es,ru', layout: google.translate.TranslateElement.InlineLayout.SIMPLE, autoDisplay: false}, 'google_translate_element');
  initLangSelect();
}
var LANG_LABELS = {'': '\u{1F310} Language / \u8bed\u8a00', 'zh-CN': '\u4e2d\u6587', 'en': 'English', 'ja': '\u65e5\u672c\u8a9e', 'ko': '\ud55c\uad6d\uc5b4', 'fr': 'Fran\u00e7ais', 'de': 'Deutsch', 'es': 'Espa\u00f1ol', 'ru': '\u0420\u0443\u0441\u0441\u043a\u0438\u0439'};
function restoreLangLabels() {
  var sel = document.getElementById('lang-select');
  if (!sel) return;
  for (var i = 0; i < sel.options.length; i++) {
    var o = sel.options[i];
    var label = LANG_LABELS[o.value];
    if (label && o.text !== label) o.text = label;
  }
}
function initLangSelect() {
  var sel = document.getElementById('lang-select');
  if (!sel) return;
  restoreLangLabels();
  if ('MutationObserver' in window) {
    var mo = new MutationObserver(function() { restoreLangLabels(); });
    mo.observe(sel, {childList: true, subtree: true, characterData: true});
  }
  var m = document.cookie.match(/(?:^|; )googtrans=\/zh-CN\/([a-z-]+)/);
  if (m && m[1]) sel.value = m[1];
  sel.addEventListener('change', function() {
    var lang = sel.value;
    if (!lang || lang === 'zh-CN') {
      document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/';
      location.reload();
      return;
    }
    var combo = document.querySelector('.goog-te-combo');
    if (combo) {
      combo.value = lang;
      combo.dispatchEvent(new Event('change'));
    } else {
      document.cookie = 'googtrans=/zh-CN/' + lang + '; path=/';
      location.reload();
    }
  });
}
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
