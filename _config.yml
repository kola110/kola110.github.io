title: 代码与日子
description: 写编程，也写生活的个人博客。
url: https://kola110.github.io
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
defaults:
  - scope:
      type: posts
    values:
      layout: post
exclude:
  - README.md
permalink: /:year/:month/:day/:title.html
plugins:
  - jekyll-redirect-from
  - jekyll-feed
